name: BEI FITS marketing automation (paused)

# Intentionally has no schedule and no job. This workflow is retained so old
# links remain understandable, but it cannot send mail in manual-only mode.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Marketing automation is paused; no email was sent."
