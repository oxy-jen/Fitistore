name: Controlled marketing campaign processing

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN MARKETING EMAIL QUEUE after separate operational approval.
        required: true
        type: string
      limit:
        description: Maximum allowlisted campaign messages in this batch (1-100).
        required: true
        default: "25"
        type: string
      preparation_confirmation:
        description: Type PREPARE MARKETING CAMPAIGN DRAFTS to run draft preparation manually.
        required: false
        type: string
  schedule:
    - cron: "*/5 * * * *"

permissions: {}

concurrency:
  group: fity-marketing-campaign-outbox
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        vars.EMAIL_MARKETING_PREPARATION_ENABLED == 'true' &&
        (github.event_name == 'schedule' || inputs.preparation_confirmation == 'PREPARE MARKETING CAMPAIGN DRAFTS')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: read
    steps:
      - name: Check out preparation revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare verified database TLS settings
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          EXPECTED_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          EXPECTED_DATABASE_SCHEMA: ${{ vars.NEON_DATABASE_SCHEMA }}
          EXPECTED_DATABASE_HOST: ${{ vars.NEON_DATABASE_HOST }}
        run: python scripts/customer_email_schema_guard.py tls-env
      - name: Check database connection settings
        env:
          EXPECTED_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          EXPECTED_DATABASE_SCHEMA: ${{ vars.NEON_DATABASE_SCHEMA }}
          EXPECTED_DATABASE_HOST: ${{ vars.NEON_DATABASE_HOST }}
        run: python scripts/customer_email_schema_guard.py settings
      - name: Read-only schema and identity preflight
        env:
          EXPECTED_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          EXPECTED_DATABASE_SCHEMA: ${{ vars.NEON_DATABASE_SCHEMA }}
          EXPECTED_DATABASE_HOST: ${{ vars.NEON_DATABASE_HOST }}
        run: python scripts/customer_email_schema_guard.py preflight
      - name: Prepare review-only campaign drafts
        env:
          FLASK_APP: manage:app
          APP_ENV: production
          SECRET_KEY: ${{ secrets.FITY_SECRET_KEY }}
          EMAIL_MARKETING_PREPARATION_ENABLED: ${{ vars.EMAIL_MARKETING_PREPARATION_ENABLED }}
          EMAIL_MARKETING_AUTO_SCHEDULE_GENERATED_ENABLED: ${{ vars.EMAIL_MARKETING_AUTO_SCHEDULE_GENERATED_ENABLED }}
          EMAIL_MARKETING_QUEUE_ENABLED: ${{ vars.EMAIL_MARKETING_QUEUE_ENABLED }}
          EMAIL_MARKETING_NEW_PRODUCTS_ENABLED: ${{ vars.EMAIL_MARKETING_NEW_PRODUCTS_ENABLED }}
          EMAIL_MARKETING_OFFERS_ENABLED: ${{ vars.EMAIL_MARKETING_OFFERS_ENABLED }}
          EMAIL_MARKETING_WEEKLY_PICKS_ENABLED: ${{ vars.EMAIL_MARKETING_WEEKLY_PICKS_ENABLED }}
          EMAIL_MARKETING_ABANDONED_CART_ENABLED: ${{ vars.EMAIL_MARKETING_ABANDONED_CART_ENABLED }}
          EMAIL_MARKETING_NEW_ARRIVAL_LOOKBACK_DAYS: ${{ vars.EMAIL_MARKETING_NEW_ARRIVAL_LOOKBACK_DAYS || '7' }}
          EMAIL_MARKETING_ABANDONED_CART_IDLE_MINUTES: ${{ vars.EMAIL_MARKETING_ABANDONED_CART_IDLE_MINUTES || '180' }}
        run: python -m flask --app manage:app prepare-marketing-campaign-drafts
  process:
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        vars.EMAIL_MARKETING_QUEUE_ENABLED == 'true' &&
        (github.event_name == 'schedule' || inputs.confirmation == 'RUN MARKETING EMAIL QUEUE')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: read
    steps:
      - name: Check out dispatch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare verified database TLS settings
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          EXPECTED_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          EXPECTED_DATABASE_SCHEMA: ${{ vars.NEON_DATABASE_SCHEMA }}
          EXPECTED_DATABASE_HOST: ${{ vars.NEON_DATABASE_HOST }}
        run: python scripts/customer_email_schema_guard.py tls-env
      - name: Check database connection settings
        env:
          EXPECTED_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          EXPECTED_DATABASE_SCHEMA: ${{ vars.NEON_DATABASE_SCHEMA }}
          EXPECTED_DATABASE_HOST: ${{ vars.NEON_DATABASE_HOST }}
        run: python scripts/customer_email_schema_guard.py settings
      - name: Read-only schema and identity preflight
        env:
          EXPECTED_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          EXPECTED_DATABASE_SCHEMA: ${{ vars.NEON_DATABASE_SCHEMA }}
          EXPECTED_DATABASE_HOST: ${{ vars.NEON_DATABASE_HOST }}
        run: python scripts/customer_email_schema_guard.py preflight
      - name: Process one approved campaign batch
        env:
          FLASK_APP: manage:app
          APP_ENV: production
          SECRET_KEY: ${{ secrets.FITY_SECRET_KEY }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          MAIL_FROM_VERIFIED: ${{ vars.MAIL_FROM_VERIFIED }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_SERVER: ${{ vars.MAIL_SERVER }}
          MAIL_PORT: ${{ vars.MAIL_PORT || '587' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          EMAIL_MARKETING_QUEUE_ENABLED: ${{ vars.EMAIL_MARKETING_QUEUE_ENABLED }}
          EMAIL_MARKETING_NEW_PRODUCTS_ENABLED: ${{ vars.EMAIL_MARKETING_NEW_PRODUCTS_ENABLED }}
          EMAIL_MARKETING_OFFERS_ENABLED: ${{ vars.EMAIL_MARKETING_OFFERS_ENABLED }}
          EMAIL_MARKETING_WEEKLY_PICKS_ENABLED: ${{ vars.EMAIL_MARKETING_WEEKLY_PICKS_ENABLED }}
          EMAIL_MARKETING_ABANDONED_CART_ENABLED: ${{ vars.EMAIL_MARKETING_ABANDONED_CART_ENABLED }}
          EMAIL_MARKETING_SEASONAL_ENABLED: ${{ vars.EMAIL_MARKETING_SEASONAL_ENABLED }}
          EMAIL_MARKETING_CUSTOM_ENABLED: ${{ vars.EMAIL_MARKETING_CUSTOM_ENABLED }}
          QUEUE_LIMIT: ${{ inputs.limit || '25' }}
          QUEUE_CONFIRMATION: ${{ inputs.confirmation || 'RUN MARKETING EMAIL QUEUE' }}
        run: >-
          python -m flask --app manage:app process-marketing-email-queue
          --limit "$QUEUE_LIMIT" --max-seconds 240 --confirmation "$QUEUE_CONFIRMATION"
