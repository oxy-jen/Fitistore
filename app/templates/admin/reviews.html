{% extends "base.html" %}{% block content %}<section class="page-head"><h1>Review moderation</h1></section>{% for review in reviews %}<article class="order-card"><strong>{{ review.display_name }}</strong><p>{{ review.rating }}/5 | {{ review.status }}</p><p>{{ review.text }}</p><form method="post" action="{{ url_for('admin.update_review', review_id=review.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="status"><option {% if review.status=='pending' %}selected{% endif %}>pending</option><option {% if review.status=='approved' %}selected{% endif %}>approved</option><option {% if review.status=='rejected' %}selected{% endif %}>rejected</option></select><button class="btn primary">Save</button></form></article>{% else %}<div class="empty">No review submissions yet.</div>{% endfor %}{% endblock %}
