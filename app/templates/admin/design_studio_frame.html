<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if lottie_animation %}
  <script src="{{ url_for('static', filename='vendor/lottie.min.js') }}"></script>
  <script type="application/json" id="fity-lottie-data">{{ lottie_animation|tojson }}</script>
  {% endif %}
</head>
<body data-motion="{{ design.motion_preset }}" style="--studio-motion-duration:{{ motion_duration }}ms">
  <main class="studio-content">
    {{ design_html|safe }}
  </main>
  <style>
    :where(.studio-product-rail,.studio-product-canvas,.ds-campaign-product-track,.offers-scroll-content) [data-studio-card-key]{order:9999}
    {{ design.css|safe }}
    html,body{margin:0;padding:0;width:100%;font-family:system-ui,sans-serif}
    .studio-content{box-sizing:border-box}
    [data-motion="fade"] .studio-content{animation:studio-fade var(--studio-motion-duration) ease both}
    [data-motion="rise"] .studio-content{animation:studio-rise var(--studio-motion-duration) ease both}
    [data-motion="scale"] .studio-content{animation:studio-scale var(--studio-motion-duration) ease both}
    .studio-editor-active [data-studio-edit-id]{cursor:text}
    .studio-editor-active [data-studio-edit-id]:hover,.studio-editor-active [data-studio-edit-id][contenteditable="plaintext-only"]{outline:2px dashed #e52335;outline-offset:3px}
    .studio-editor-active [data-studio-card-key]{cursor:grab;touch-action:none}
    .studio-editor-active .studio-card-dragging{z-index:20;opacity:.76;cursor:grabbing;transition:none}
    .studio-editor-active .studio-card-parts-separated [data-studio-card-part]{outline:1px dashed rgba(229,35,53,.55);cursor:move;touch-action:none}
    .studio-editor-active .studio-card-parts-separated [data-studio-card-part]:hover{outline:2px solid #e52335;outline-offset:2px}
    .studio-editor-active .studio-card-parts-separated [data-studio-card-part="pedestal"],.studio-editor-active .studio-card-parts-separated [data-studio-card-part="pedestal"] *{pointer-events:auto!important}
    .studio-editor-active .studio-card-parts-separated .studio-product-image{overflow:visible}
    .studio-lottie-section-target,.studio-lottie-premium-target{position:relative;isolation:isolate}
    .studio-lottie-premium-target{overflow:hidden}
    .studio-lottie-section-background,.studio-lottie-premium-background{position:absolute;inset:0;z-index:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
    .studio-lottie-section-background{opacity:.42}
    .studio-lottie-premium-background{opacity:.34;mix-blend-mode:screen}
    .studio-lottie-section-background svg,.studio-lottie-premium-background svg{display:block;width:100%;height:100%}
    .studio-lottie-section-target>*:not(.studio-lottie-section-background),.studio-lottie-premium-target>*:not(.studio-lottie-premium-background){position:relative;z-index:1}
    @keyframes studio-fade{from{opacity:0}to{opacity:1}}
    @keyframes studio-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes studio-scale{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
  <script type="application/json" id="studio-user-code">{{ design.javascript|tojson }}</script>
  <script>
    const studioProducts = {{ products|tojson }};
    const studioApi = Object.freeze({
      addToCart(productId, quantity = 1, variantId = null) {
        parent.postMessage({type:'fity-studio', action:'add-to-cart', productId, quantity, variantId}, '*');
      },
      openProduct(productId) {
        parent.postMessage({type:'fity-studio', action:'open-product', productId}, '*');
      },
      navigate(path) {
        parent.postMessage({type:'fity-studio', action:'navigate', path}, '*');
      },
      resize(height) {
        parent.postMessage({type:'fity-studio', action:'resize', height}, '*');
      }
    });
    let visualEditorEnabled = false;
    let cardMovementMode = 'reorder';
    let activeCardDrag = null;
    const cardRailSelector = '[data-studio-product-canvas],.ds-campaign-product-track,.offers-scroll-content';
    function cardsInVisualOrder(rail) {
      return [...rail.querySelectorAll('[data-studio-card-key]')].sort((first, second) => {
        const orderDifference = Number(getComputedStyle(first).order) - Number(getComputedStyle(second).order);
        if (orderDifference) return orderDifference;
        const relation = first.compareDocumentPosition(second);
        return relation & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
      });
    }
    function cardTransformOffset(card) {
      const transform = getComputedStyle(card).transform;
      const matrix2d = transform.match(/^matrix\(([^)]+)\)$/);
      if (matrix2d) {
        const values = matrix2d[1].split(',').map(Number);
        return {x: values[4] || 0, y: values[5] || 0};
      }
      const matrix3d = transform.match(/^matrix3d\(([^)]+)\)$/);
      if (matrix3d) {
        const values = matrix3d[1].split(',').map(Number);
        return {x: values[12] || 0, y: values[13] || 0};
      }
      return {x: 0, y: 0};
    }
    function syncCardPartModes() {
      document.querySelectorAll('.studio-content [data-studio-card-key]').forEach(card => {
        const separated = getComputedStyle(card).getPropertyValue('--studio-card-parts-separated').trim() === '1';
        card.classList.toggle('studio-card-parts-separated', separated);
      });
    }
    document.addEventListener('pointerdown', event => {
      if (!visualEditorEnabled || event.button !== 0 || !(event.target instanceof Element)) return;
      const card = event.target.closest('[data-studio-card-key]');
      if (!card || event.target.closest('[data-studio-edit-id]')) return;
      const rail = card.closest(cardRailSelector);
      if (!rail) return;
      const part = card.classList.contains('studio-card-parts-separated')
        ? event.target.closest('[data-studio-card-part]')
        : null;
      const target = part && card.contains(part) ? part : card;
      const rect = target.getBoundingClientRect();
      const offset = cardTransformOffset(target);
      activeCardDrag = {
        card, target, part: part && target === part ? part.dataset.studioCardPart : '',
        rail, pointerId: event.pointerId, mode: part && target === part ? 'part' : cardMovementMode,
        startX: event.clientX, startY: event.clientY,
        startLeft: rect.left, startTop: rect.top,
        width: rect.width, height: rect.height,
        offsetX: offset.x, offsetY: offset.y, moved: false
      };
      card.setPointerCapture(event.pointerId);
      event.preventDefault();
    });
    document.addEventListener('pointermove', event => {
      if (!activeCardDrag || activeCardDrag.pointerId !== event.pointerId) return;
      const deltaX = event.clientX - activeCardDrag.startX;
      const deltaY = event.clientY - activeCardDrag.startY;
      if (!activeCardDrag.moved && Math.hypot(deltaX, deltaY) < 5) return;
      activeCardDrag.moved = true;
      activeCardDrag.target.classList.add('studio-card-dragging');
      activeCardDrag.target.style.translate = `${deltaX}px ${deltaY}px`;
      event.preventDefault();
    });
    function finishCardDrag(event) {
      if (!activeCardDrag || activeCardDrag.pointerId !== event.pointerId) return;
      const drag = activeCardDrag;
      activeCardDrag = null;
      if (drag.target.hasPointerCapture(event.pointerId)) drag.target.releasePointerCapture(event.pointerId);
      drag.target.classList.remove('studio-card-dragging');
      drag.target.style.translate = '';
      if (!drag.moved) return;
      if (drag.mode === 'part' && drag.width > 0 && drag.height > 0) {
        const deltaX = event.clientX - drag.startX;
        const deltaY = event.clientY - drag.startY;
        const x = Math.max(-300, Math.min(300, drag.offsetX / drag.width * 100 + deltaX / drag.width * 100));
        const y = Math.max(-300, Math.min(300, drag.offsetY / drag.height * 100 + deltaY / drag.height * 100));
        drag.target.style.transform = `translate(${x.toFixed(2)}%, ${y.toFixed(2)}%)`;
        parent.postMessage({
          type: 'fity-studio', action: 'card-part-position',
          key: drag.card.dataset.studioCardKey, part: drag.part, x, y
        }, '*');
        return;
      }
      if (drag.mode === 'free' && drag.width > 0 && drag.height > 0) {
        const deltaX = event.clientX - drag.startX;
        const deltaY = event.clientY - drag.startY;
        const productCanvas = drag.card.closest('.studio-product-canvas');
        const boundsElement = productCanvas || drag.card.closest('.studio-product-rail,.ds-campaign-products,.offers-scroll-viewport');
        const productBounds = boundsElement ? boundsElement.getBoundingClientRect() : null;
        const viewport = productCanvas && productCanvas.closest('.offers-scroll-viewport');
        const viewportBounds = viewport ? viewport.getBoundingClientRect() : null;
        const bounds = productBounds && viewportBounds
          ? {
            left: Math.max(productBounds.left, viewportBounds.left),
            right: Math.min(productBounds.right, viewportBounds.right),
            top: Math.max(productBounds.top, viewportBounds.top),
            bottom: Math.min(productBounds.bottom, viewportBounds.bottom)
          }
          : productBounds;
        const nextLeft = bounds
          ? Math.max(bounds.left, Math.min(bounds.right - drag.width, drag.startLeft + deltaX))
          : drag.startLeft + deltaX;
        const nextTop = bounds
          ? Math.max(bounds.top, Math.min(bounds.bottom - drag.height, drag.startTop + deltaY))
          : drag.startTop + deltaY;
        const x = Math.max(-500, Math.min(500, ((drag.offsetX + nextLeft - drag.startLeft) / drag.width) * 100));
        const y = Math.max(-500, Math.min(500, ((drag.offsetY + nextTop - drag.startTop) / drag.height) * 100));
        drag.card.style.transform = `translate(${x.toFixed(2)}%, ${y.toFixed(2)}%)`;
        parent.postMessage({
          type: 'fity-studio', action: 'card-position',
          key: drag.card.dataset.studioCardKey, x, y
        }, '*');
        return;
      }
      const orderedCards = cardsInVisualOrder(drag.rail).filter(card => card !== drag.card);
      const insertAt = orderedCards.findIndex(card =>
        event.clientX < card.getBoundingClientRect().left + card.getBoundingClientRect().width / 2
      );
      if (insertAt < 0) orderedCards.push(drag.card);
      else orderedCards.splice(insertAt, 0, drag.card);
      orderedCards.forEach((card, index) => {
        card.style.order = String(index + 1);
      });
      parent.postMessage({
        type: 'fity-studio', action: 'card-order',
        keys: orderedCards.map(card => card.dataset.studioCardKey)
      }, '*');
    }
    document.addEventListener('pointerup', finishCardDrag);
    document.addEventListener('pointercancel', finishCardDrag);
    document.addEventListener('click', event => {
      if (!(event.target instanceof Element)) return;
      if (visualEditorEnabled) {
        const editable = event.target.closest('[data-studio-edit-id]');
        if (editable) {
          event.preventDefault();
          editable.contentEditable = 'plaintext-only';
          editable.focus({preventScroll: true});
          return;
        }
      }
      const link = event.target.closest('a[href]');
      if (link) {
        if (visualEditorEnabled) {
          event.preventDefault();
          return;
        }
        const path = link.getAttribute('href');
        const product = studioProducts.find(item => item.url === path);
        if (product) {
          event.preventDefault();
          studioApi.openProduct(product.id);
          return;
        }
        if (typeof path === 'string' && /^\/product\/[A-Za-z0-9_-]{1,170}$/.test(path)) {
          event.preventDefault();
          studioApi.navigate(path);
          return;
        }
        if (['/shop', '/upcoming', '/cart'].includes(path)) {
          event.preventDefault();
          studioApi.navigate(path);
          return;
        }
        event.preventDefault();
      }
      const button = event.target.closest('[data-studio-action]');
      if (button && button.dataset.productId && button.dataset.studioAction === 'add-to-cart') {
        event.preventDefault();
        studioApi.addToCart(Number(button.dataset.productId), 1, null);
      } else if (button && button.dataset.productId && button.dataset.studioAction === 'open-product') {
        event.preventDefault();
        studioApi.openProduct(Number(button.dataset.productId));
      }
    });
    document.addEventListener('focusout', event => {
      if (!visualEditorEnabled || !(event.target instanceof HTMLElement)
          || !event.target.matches('[data-studio-edit-id][contenteditable]')) return;
      const element = event.target;
      element.removeAttribute('contenteditable');
      parent.postMessage({
        type: 'fity-studio', action: 'text-edit',
        id: element.dataset.studioEditId, html: element.innerHTML
      }, '*');
    });

    const userCode = JSON.parse(document.getElementById('studio-user-code').textContent || '""');
    let studioWorker = null;
    let studioWorkerUrl = null;
    let workerReady = false;
    let workerBusy = false;
    let workerTimeout = null;
    const stopStudioWorker = reason => {
      if (workerTimeout) clearTimeout(workerTimeout);
      workerTimeout = null;
      if (studioWorker) studioWorker.terminate();
      studioWorker = null;
      if (studioWorkerUrl) URL.revokeObjectURL(studioWorkerUrl);
      studioWorkerUrl = null;
      workerReady = false;
      workerBusy = false;
      if (reason) {
        document.body.dataset.studioScriptError = reason;
        console.warn('FityStores Design Studio custom code stopped:', reason);
      }
    };
    const handleWorkerCommand = command => {
      if (!command || command.type !== 'studio-command') return;
      if (command.action === 'navigate') {
        if (['/shop', '/upcoming', '/cart'].includes(command.path)) studioApi.navigate(command.path);
        return;
      }
      if (command.action === 'resize') {
        const height = Number(command.height);
        if (Number.isFinite(height)) studioApi.resize(Math.max(80, Math.min(1200, Math.round(height))));
        return;
      }
      const productId = Number(command.productId);
      const product = studioProducts.find(item => item.id === productId);
      if (!product) return;
      if (command.action === 'open-product') {
        studioApi.openProduct(productId);
        return;
      }
      if (command.action !== 'add-to-cart') return;
      const quantity = Number(command.quantity);
      const variantId = command.variantId === null ? null : Number(command.variantId);
      if (!Number.isInteger(quantity) || quantity < 1 || quantity > 5) return;
      if (variantId !== null && (!Number.isInteger(variantId) || !product.variant_ids.includes(variantId))) return;
      studioApi.addToCart(productId, quantity, variantId);
    };
    const notifyWorker = (name, detail) => {
      if (!studioWorker || !workerReady || workerBusy) return;
      workerBusy = true;
      workerTimeout = setTimeout(() => stopStudioWorker('execution-timeout'), 150);
      studioWorker.postMessage({type:'studio-event', name, detail});
    };
    if (userCode.trim() && typeof Worker === 'function' && typeof Blob === 'function') {
      const productVariants = JSON.stringify(studioProducts.map(product => [product.id, product.variant_ids]));
      const workerSource = `
        "use strict";
        const sendToFrame = self.postMessage.bind(self);
        const productVariants = new Map(${productVariants});
        const callbacks = Object.create(null);
        const api = Object.freeze({
          on(name, callback) {
            if (!["ready","click"].includes(name) || typeof callback !== "function") return;
            callbacks[name] = callbacks[name] || [];
            if (callbacks[name].length < 8) callbacks[name].push(callback);
          },
          addToCart(productId, quantity = 1, variantId = null) {
            productId = Number(productId);
            quantity = Number(quantity);
            const variants = productVariants.get(productId);
            if (!variants || !Number.isInteger(quantity) || quantity < 1 || quantity > 5) return;
            if (variantId !== null && !variants.includes(Number(variantId))) return;
            sendToFrame({type:"studio-command", action:"add-to-cart", productId, quantity, variantId});
          },
          openProduct(productId) {
            productId = Number(productId);
            if (productVariants.has(productId)) sendToFrame({type:"studio-command", action:"open-product", productId});
          },
          navigate(path) {
            if (["/shop","/upcoming","/cart"].includes(path)) sendToFrame({type:"studio-command", action:"navigate", path});
          },
          resize(height) {
            height = Number(height);
            if (Number.isFinite(height)) sendToFrame({type:"studio-command", action:"resize", height});
          }
        });
        (function(FityStudio, document, window, self, globalThis, fetch, XMLHttpRequest, WebSocket, EventSource, setTimeout, setInterval, requestAnimationFrame, Worker, SharedWorker, importScripts, postMessage) {
          "use strict";
      ` + userCode + `
        })(api, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined);
        sendToFrame({type:"studio-ready"});
        self.addEventListener("message", event => {
          const data = event.data;
          if (!data || data.type !== "studio-event" || !["ready","click"].includes(data.name)) return;
          for (const callback of callbacks[data.name] || []) {
            try { callback(Object.freeze(data.detail || {})); }
            catch { sendToFrame({type:"studio-error"}); }
          }
          sendToFrame({type:"studio-event-complete"});
        });
      `;
      try {
        studioWorkerUrl = URL.createObjectURL(new Blob([workerSource], {type:'text/javascript'}));
        studioWorker = new Worker(studioWorkerUrl);
        workerTimeout = setTimeout(() => stopStudioWorker('startup-timeout'), 1000);
        studioWorker.addEventListener('message', event => {
          const message = event.data;
          if (!message || typeof message !== 'object') return;
          if (message.type === 'studio-command') {
            handleWorkerCommand(message);
          } else if (message.type === 'studio-ready') {
            if (workerTimeout) clearTimeout(workerTimeout);
            workerTimeout = null;
            if (studioWorkerUrl) URL.revokeObjectURL(studioWorkerUrl);
            studioWorkerUrl = null;
            workerBusy = false;
            workerReady = true;
            notifyWorker('ready', {});
          } else if (message.type === 'studio-event-complete') {
            if (workerTimeout) clearTimeout(workerTimeout);
            workerTimeout = null;
            workerBusy = false;
          } else if (message.type === 'studio-error') {
            console.warn('FityStores Design Studio custom code handler failed.');
          }
        });
        studioWorker.addEventListener('error', () => stopStudioWorker('worker-error'));
      } catch (error) {
        console.error('FityStores Design Studio custom code worker could not start.', error);
        stopStudioWorker('worker-start-failed');
      }
    }
    document.addEventListener('click', event => {
      if (!(event.target instanceof Element)) return;
      const target = event.target.closest('a[href],[data-studio-action]');
      if (!target) return;
      notifyWorker('click', {
        id: target.id || '',
        action: target.dataset.studioAction || '',
        productId: /^\d+$/.test(target.dataset.productId || '') ? Number(target.dataset.productId) : null
      });
    });

    {% if lottie_animation %}
    const lottieData = JSON.parse(document.getElementById('fity-lottie-data').textContent);
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const designRoot = document.querySelector('.studio-content [data-studio-lottie-target]')
      || document.querySelector('.studio-content')?.firstElementChild;
    const requestedTarget = designRoot?.dataset.studioLottieTarget || 'section';
    const isProductTarget = /^(?:p-\d+|c-[a-z0-9-]{1,70})$/.test(requestedTarget);
    const productTarget = isProductTarget
      ? [...document.querySelectorAll('.studio-content [data-studio-card-key]')]
        .find(card => card.dataset.studioCardKey === requestedTarget)
      : null;
    let targetElement = requestedTarget === 'section' ? designRoot : productTarget;
    const premiumTarget = Boolean(productTarget);
    if (!targetElement && designRoot) {
      console.warn('FityStores Design Studio Lottie target is missing; using the section background.');
      parent.postMessage({type:'fity-studio', action:'lottie-target-missing'}, '*');
      targetElement = designRoot;
    }
    if (targetElement) {
      targetElement.classList.add(premiumTarget ? 'studio-lottie-premium-target' : 'studio-lottie-section-target');
      const layer = document.createElement('div');
      layer.className = premiumTarget ? 'studio-lottie-premium-background' : 'studio-lottie-section-background';
      layer.dataset.studioLottie = '';
      layer.setAttribute('aria-hidden', 'true');
      targetElement.prepend(layer);
      if (window.lottie) {
        try {
          window.lottie.loadAnimation({
            container: layer,
            renderer: 'svg',
            loop: !reduceMotion,
            autoplay: !reduceMotion,
            rendererSettings: {preserveAspectRatio:'xMidYMid slice'},
            animationData: lottieData
          });
        } catch (error) {
          console.error('FityStores Design Studio could not render the Lottie background.', error);
          parent.postMessage({type:'fity-studio', action:'lottie-render-error'}, '*');
        }
      } else {
        console.error('FityStores Design Studio Lottie player is unavailable.');
        parent.postMessage({type:'fity-studio', action:'lottie-render-error'}, '*');
      }
    } else {
      console.error('FityStores Design Studio cannot place the Lottie background because the design has no section.');
      parent.postMessage({type:'fity-studio', action:'lottie-render-error'}, '*');
    }
    {% endif %}
    const reportHeight = () => {
      const content = document.querySelector('.studio-content');
      const height = content
        ? Math.max(content.scrollHeight, Math.ceil(content.getBoundingClientRect().height))
        : document.body.scrollHeight;
      parent.postMessage({type:'fity-studio', action:'resize', height}, '*');
    };
    addEventListener('message', event => {
      if (event.source !== parent || !event.data || event.data.type !== 'fity-studio-command') return;
      if (event.data.action === 'measure') {
        reportHeight();
      } else if (event.data.action === 'enable-visual-editor') {
        visualEditorEnabled = true;
        cardMovementMode = event.data.cardMode === 'free' ? 'free' : 'reorder';
        document.body.classList.add('studio-editor-active');
        document.documentElement.classList.toggle('studio-card-free-position-mode', cardMovementMode === 'free');
        syncCardPartModes();
      }
    });
    new ResizeObserver(reportHeight).observe(document.querySelector('.studio-content'));
    addEventListener('load', reportHeight);
  </script>
</body>
</html>
