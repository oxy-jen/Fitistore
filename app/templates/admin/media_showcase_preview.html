{% extends "base.html" %}{% block content %}<section class="page-head"><div><p class="eyebrow">Private preview · {{ showcase.is_published and 'Published' or 'Draft' }}</p><h1>{{ showcase.name }}</h1><p>Preview follows the showcase layout without changing its publication status.</p></div><a class="btn" href="{{ url_for('admin.media_showcase_edit', showcase_id=showcase.id) }}">Edit</a></section><div class="preview-size-controls" aria-label="Preview size"><button class="btn" data-width="390">Mobile</button><button class="btn" data-width="768">Tablet</button><button class="btn" data-width="1200">Desktop</button></div><div class="preview-frame" data-preview-frame><div class="preview-inner">{% include "partials/media_showcase.html" %}</div></div><script>document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>document.querySelector('[data-preview-frame]').style.maxWidth=b.dataset.width+'px'));</script>{% endblock %}
