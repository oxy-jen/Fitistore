{% set offer_image = product_display_image(product) %}
{% set offer_url = url_for('public.product_detail', slug=product.slug) %}
<article class="offers-product-card" data-product-card="{{ product.id }}">
  <div class="offers-product-copy">
    <p class="offers-product-category">{{ product.category.name }}</p>
    <h3><a href="{{ offer_url }}">{{ product.name }}</a></h3>
  </div>
  <a class="offers-product-image" href="{{ offer_url }}" aria-label="View {{ product.name }} offer">
    <img src="{{ product_image_url(offer_image) }}" alt="{{ product_image_alt(offer_image, product.name) }}" loading="lazy" width="540" height="540">
  </a>
  <div class="offers-price-group">
    <a class="offers-current-price" href="{{ offer_url }}">{{ money(product.price_cents, settings.currency) }}</a>
    <s class="offers-original-price">{{ money(product.previous_price_cents, settings.currency) }}</s>
  </div>
</article>
