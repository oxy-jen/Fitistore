{% extends "base.html" %}{% block content %}<section class="form-card account-form"><h1>Customer sign in</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary">Sign in</button></form><p><a href="{{ url_for('customer.forgot_password') }}">Forgot password?</a> · <a href="{{ url_for('customer.register') }}">Create account</a></p>{% if google_client_id %}<script src="https://accounts.google.com/gsi/client" async defer></script><div id="g_id_onload" data-client_id="{{ google_client_id }}" data-callback="onGoogleSignIn" data-ux_mode="popup" data-auto_prompt="false"></div><div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="continue_with" data-shape="rectangular"></div><form id="google-signin-form" method="post" action="{{ url_for('customer.google_signin') }}" hidden><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input id="google-credential" type="hidden" name="credential"></form><script>function onGoogleSignIn(result){const form=document.getElementById("google-signin-form");document.getElementById("google-credential").value=result.credential;form.requestSubmit();}</script>{% else %}<p>Google sign-in is not configured yet. Email sign-in is available.</p>{% endif %}</section>{% endblock %}
