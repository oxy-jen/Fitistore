{% extends "base.html" %}{% block content %}<section class="form-card account-form"><h1>Enter your email code</h1><p>Enter the six-digit code for <strong>{{ email }}</strong>. Codes expire in 10 minutes. Check Spam or All Mail if you do not see yours.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Six-digit code<input name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" required></label><button class="btn primary">Verify code</button></form><form method="post" action="{{ url_for('customer.resend_email_code') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn">Resend code</button></form></section>{% endblock %}
