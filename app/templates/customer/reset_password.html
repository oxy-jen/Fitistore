{% extends "base.html" %}{% block content %}<section class="form-card account-form"><h1>Choose a new password</h1>{% if valid %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>New password (minimum 12 characters)<input type="password" name="password" minlength="12" required autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm_password" minlength="12" required autocomplete="new-password"></label><button class="btn primary">Update password</button></form>{% else %}<p>This link is invalid or expired. <a href="{{ url_for('customer.forgot_password') }}">Request a new link</a>.</p>{% endif %}</section>{% endblock %}
