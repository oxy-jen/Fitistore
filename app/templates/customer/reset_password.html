{% extends "base.html" %}
{% block content %}
<section class="account-page account-page-single"><div class="account-intro"><p class="eyebrow">Account recovery</p><h1>Choose a new password.</h1><p>Use a unique password with at least 12 characters.</p></div>
<div class="account-panel">{% if valid %}<form method="post" class="account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>New password<input type="password" name="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label>Confirm new password<input type="password" name="confirm_password" minlength="12" maxlength="128" required autocomplete="new-password"></label><button class="btn primary wide" type="submit">Update password</button></form>{% else %}<p>This link is invalid or expired.</p><a class="btn primary" href="{{ url_for('customer.forgot_password') }}">Request a new link</a>{% endif %}</div></section>
{% endblock %}
