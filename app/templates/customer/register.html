{% extends "base.html" %}{% block content %}<section class="form-card account-form"><h1>Create your FityStores account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="display_name" maxlength="120" required autocomplete="name"></label><label>Email<input type="email" name="email" maxlength="254" required autocomplete="email"></label><label>Password (minimum 12 characters)<input type="password" name="password" minlength="12" required autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm_password" minlength="12" required autocomplete="new-password"></label><label class="check"><input type="checkbox" name="marketing_opt_in" value="yes"> Yes, I’d like occasional FityStores offers, new arrivals and promotions by email. I can unsubscribe at any time.</label><p>Promotional email is optional and requires confirmation. Read our <a href="{{ url_for('public.privacy_policy') }}">privacy information</a> and <a href="{{ url_for('public.terms') }}">terms</a>.</p><button class="btn primary">Create account</button></form><p>Already registered? <a href="{{ url_for('customer.login') }}">Sign in</a>.</p></section>{% endblock %}
