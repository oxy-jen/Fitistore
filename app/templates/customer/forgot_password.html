{% extends "base.html" %}
{% block content %}
<section class="account-page account-page-single"><div class="account-intro"><p class="eyebrow">Account recovery</p><h1>Reset your password.</h1><p>We will send a secure reset link if this email belongs to a verified account.</p></div>
<div class="account-panel"><h2>Request a reset link</h2><form method="post" class="account-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" required autocomplete="email"></label><button class="btn primary wide" type="submit">Send reset instructions</button></form><p><a href="{{ url_for('customer.login') }}">Return to sign in</a></p></div></section>
{% endblock %}
